<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岗位历任 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=41" />
</head>
<body class="app" data-page="posts">
  <header class="app-header" id="app-header"></header>
  <main class="app-main">
    <div class="shell">
      <section class="panel-card" aria-labelledby="posts-heading">
        <h1 class="panel-heading" id="posts-heading">按岗位查现任 / 历任</h1>
        <p class="muted panel-lead">按科室或职务检索岗位，点开查看该岗位现任与历任。</p>
        <form class="filter-grid" id="posts-form" autocomplete="off">
          <div class="field">
            <label for="org_level">地区层级</label>
            <select id="org_level" name="org_level">
              <option value="">全部层级</option>
            </select>
          </div>
          <div class="field">
            <label for="region_category">地区分类</label>
            <select id="region_category" name="region_category">
              <option value="">全部分类</option>
            </select>
          </div>
          <div class="field">
            <label for="bureau_code">具体地区</label>
            <select id="bureau_code" name="bureau_code">
              <option value="">全部地区</option>
            </select>
          </div>
          <div class="field">
            <label for="department">工作科室</label>
            <select id="department" name="department">
              <option value="">全部科室</option>
            </select>
          </div>
          <div class="field">
            <label for="title">职务</label>
            <select id="title" name="title">
              <option value="">全部职务</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn" type="submit" id="posts-btn">检索岗位</button>
            <button class="btn secondary" type="button" id="reset-btn">重置</button>
          </div>
        </form>
      </section>

      <div class="results-summary" id="posts-meta">选择科室、职务或具体地区后检索。</div>
      <div id="posts-list"></div>
      <nav class="pagination" id="posts-pager" aria-label="岗位列表分页" hidden></nav>
      <div class="status" id="posts-status" hidden></div>
    </div>
  </main>
  <script src="/static/js/common.js?v=26"></script>
  <script src="/static/js/posts.js?v=10"></script>
</body>
</html>
