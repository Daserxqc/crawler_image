<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>变动流 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=55" />
</head>
<body class="app" data-page="changes">
  <header class="app-header" id="app-header"></header>

  <main class="app-main">
    <div class="shell">
      <section class="panel-card" aria-labelledby="changes-heading">
        <h2 class="panel-heading" id="changes-heading">变动筛选</h2>
        <form class="filter-grid" id="changes-form" autocomplete="off">
          <div class="field">
            <label for="org_level">地区层级</label>
            <select id="org_level" name="org_level">
              <option value="">全部层级</option>
            </select>
          </div>
          <div class="field">
            <label for="region_category">地区分类</label>
            <select id="region_category" name="region_category">
              <option value="">全部分类</option>
            </select>
          </div>
          <div class="field">
            <label for="bureau_code">具体地区</label>
            <select id="bureau_code" name="bureau_code">
              <option value="">全部地区</option>
            </select>
          </div>
          <div class="field">
            <label for="department">工作科室</label>
            <select id="department" name="department">
              <option value="">全部科室</option>
            </select>
          </div>
          <div class="field">
            <label for="change_type">变动类型</label>
            <select id="change_type" name="change_type">
              <option value="">全部</option>
              <option value="appoint">任职</option>
              <option value="dismiss">免职</option>
              <option value="promote">晋升</option>
              <option value="transfer">调任</option>
              <option value="retire">退休</option>
              <option value="probation_confirm">试用期满</option>
            </select>
          </div>
          <div class="filter-actions">
            <button class="btn" type="submit" id="changes-btn">查看</button>
            <button class="btn secondary" type="button" id="reset-btn">重置</button>
          </div>
          <div class="watch-only-field">
            <label class="checkbox-label" for="watch_only">
              <input id="watch_only" name="watch_only" type="checkbox" />
              仅看我的关注
            </label>
            <span class="muted watch-only-hint" id="watch-only-hint"></span>
          </div>
        </form>
        <div class="watch-bar" id="changes-watch-bar" hidden aria-label="关注当前地区"></div>
      </section>

      <div class="results-summary" id="meta">加载中…</div>
      <div id="rows"></div>
      <nav class="pagination" id="changes-pager" aria-label="变动流分页" hidden></nav>
      <div class="status" id="status" hidden></div>
    </div>
  </main>

  <script src="/static/js/common.js?v=26"></script>
  <script src="/static/js/changes.js?v=16"></script>
</body>
</html>
