<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的关注 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=27" />
</head>
<body class="app" data-page="watches">
  <header class="app-header" id="app-header"></header>
  <main class="app-main">
    <div class="shell shell-watch">
      <section class="panel-card" aria-labelledby="watch-heading">
        <h1 class="panel-heading" id="watch-heading">我的关注</h1>
        <p class="watch-lead">
          关注人员或单位后，有新的任免变动会通知你。也可以在
          <a href="/">人员查询</a>、履历页直接点「关注」。
        </p>

        <div class="watch-add" aria-labelledby="add-heading">
          <h2 class="watch-subheading" id="add-heading">添加关注</h2>
          <div class="login-method-tabs watch-add-tabs" role="tablist" aria-label="添加方式">
            <button type="button" class="login-method is-active" data-mode="person" id="mode-person">关注人员</button>
            <button type="button" class="login-method" data-mode="bureau" id="mode-bureau">关注单位</button>
          </div>

          <div id="add-person" class="watch-add-panel">
            <form id="person-form" class="login-form" autocomplete="off">
              <div class="field">
                <label for="person-q">搜索姓名</label>
                <input id="person-q" type="search" placeholder="输入姓名，如 张三" autocomplete="off" />
              </div>
              <button class="btn login-primary" type="submit" id="person-search-btn">搜索</button>
            </form>
            <div id="person-hits" class="watch-pick-list" hidden></div>
          </div>

          <div id="add-bureau" class="watch-add-panel" hidden>
            <form id="bureau-form" class="login-form" autocomplete="off">
              <div class="field">
                <label for="bureau-level">地区层级</label>
                <select id="bureau-level">
                  <option value="">全部层级</option>
                </select>
              </div>
              <div class="field">
                <label for="bureau-pick">选择单位</label>
                <select id="bureau-pick" required>
                  <option value="">请选择</option>
                </select>
              </div>
              <button class="btn login-primary" type="submit">关注此单位</button>
            </form>
          </div>
        </div>

        <p class="login-status" id="watch-status" role="status" aria-live="polite"></p>

        <h2 class="watch-subheading">已关注 <span id="watch-count" class="muted"></span></h2>
        <div id="watch-list" class="watch-list"></div>
      </section>

      <section class="panel-card" aria-labelledby="notify-heading">
        <h2 class="panel-heading" id="notify-heading">最近通知</h2>
        <p class="muted watch-notify-lead">关注对象有新变动时，会生成通知摘要。</p>
        <div id="outbox-list" class="watch-list"></div>
      </section>
    </div>
  </main>
  <script src="/static/js/common.js?v=16"></script>
  <script src="/static/js/watches.js?v=2"></script>
</body>
</html>
