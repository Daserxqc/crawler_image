<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>异常与修正 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=28" />
</head>
<body class="app" data-page="anomalies">
  <header class="app-header" id="app-header"></header>
  <main class="app-main">
    <div class="shell">
      <section class="panel-card" aria-labelledby="anom-heading">
        <div class="profile-toolbar">
          <h1 class="panel-heading" id="anom-heading">异常与人工修正</h1>
          <button type="button" class="btn" id="scan-btn">重新扫描</button>
        </div>
        <div class="filter-grid">
          <div class="field">
            <label for="status">状态</label>
            <select id="status">
              <option value="open">待处理</option>
              <option value="resolved">已解决</option>
              <option value="ignored">已忽略</option>
              <option value="">全部</option>
            </select>
          </div>
          <div class="field">
            <label for="kind">类型</label>
            <input id="kind" type="search" placeholder="如 same_name / conflict" />
          </div>
          <div class="filter-actions">
            <button class="btn secondary" type="button" id="reload-btn">刷新列表</button>
          </div>
        </div>
        <p class="status muted" id="anom-status" role="status"></p>
        <div id="anom-list" class="result-list"></div>
      </section>
    </div>
  </main>
  <script src="/static/js/common.js?v=17"></script>
  <script src="/static/js/anomalies.js?v=1"></script>
</body>
</html>
