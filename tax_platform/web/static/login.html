<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=25" />
</head>
<body class="app app-login" data-page="login">
  <header class="app-header" id="app-header"></header>

  <main class="app-main login-main">
    <div class="login-shell">
      <section class="login-card" aria-labelledby="login-heading">
        <p class="login-eyebrow">账号</p>
        <h1 class="login-title" id="login-heading">邮箱登录</h1>
        <p class="login-lead" id="login-lead">
          用邮箱接收 6 位验证码即可登录。公开检索不必登录；登录后可关注单位/人员并接收变动邮件。
        </p>

        <ol class="login-steps" aria-label="登录步骤">
          <li class="login-step is-active" data-step="1">1. 邮箱</li>
          <li class="login-step" data-step="2">2. 验证码</li>
        </ol>

        <!-- Step 1: email -->
        <form id="email-form" class="login-form" autocomplete="on" novalidate>
          <div class="field">
            <label for="email">邮箱地址</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="username email"
              placeholder="name@example.com"
              aria-describedby="email-hint"
            />
            <p class="field-hint" id="email-hint">验证码将发送到此邮箱（本地开发可自动填入）。</p>
          </div>
          <p class="login-status" id="email-status" role="status" aria-live="polite"></p>
          <button class="btn login-primary" type="submit" id="send-code-btn">发送验证码</button>
        </form>

        <!-- Step 2: OTP -->
        <form id="code-form" class="login-form" hidden autocomplete="on" novalidate>
          <p class="login-sent" id="sent-to">
            验证码已发送至 <strong id="sent-email"></strong>
            <button type="button" class="link-btn" id="change-email-btn">更换邮箱</button>
          </p>
          <div class="field">
            <label for="code">6 位验证码</label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              pattern="\d{6}"
              maxlength="6"
              minlength="6"
              required
              autocomplete="one-time-code"
              placeholder="••••••"
              aria-describedby="code-hint"
              spellcheck="false"
            />
            <p class="field-hint" id="code-hint">输入完整 6 位后将自动登录。</p>
          </div>
          <p class="login-status" id="code-status" role="status" aria-live="polite"></p>
          <button class="btn login-primary" type="submit" id="verify-btn">登录</button>
          <button class="btn secondary login-resend" type="button" id="resend-btn" disabled>
            重新发送
          </button>
        </form>

        <p class="login-footer">
          <a href="/" id="skip-login">先不登录，继续检索 →</a>
        </p>
      </section>
    </div>
  </main>

  <script src="/static/js/common.js?v=14"></script>
  <script src="/static/js/login.js?v=2"></script>
</body>
</html>
