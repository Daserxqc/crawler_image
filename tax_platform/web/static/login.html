<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=23" />
</head>
<body class="app" data-page="login">
  <header class="app-header" id="app-header"></header>
  <main class="app-main">
    <div class="shell shell-narrow">
      <section class="panel-card" aria-labelledby="login-heading">
        <h1 class="panel-heading" id="login-heading">邮箱登录</h1>
        <p class="muted">登录后可关注单位/人员，并在有新任免时收到邮件摘要。公开检索无需登录。</p>
        <form id="login-form" class="login-form" autocomplete="on">
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" required placeholder="you@example.com" />
          </div>
          <div class="field" id="code-field" hidden>
            <label for="code">验证码</label>
            <input id="code" name="code" inputmode="numeric" maxlength="6" placeholder="6 位数字" />
          </div>
          <p class="status muted" id="login-status" role="status"></p>
          <div class="filter-actions">
            <button class="btn" type="submit" id="login-submit">获取验证码</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="/static/js/common.js?v=12"></script>
  <script src="/static/js/login.js?v=1"></script>
</body>
</html>
