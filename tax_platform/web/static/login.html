<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=55" />
</head>
<body class="app app-login" data-page="login">
  <header class="app-header" id="app-header"></header>

  <main class="app-main login-main">
    <div class="login-shell">
      <section class="login-card" aria-labelledby="login-heading">
        <p class="login-eyebrow">邀请制</p>
        <h1 class="login-title" id="login-heading">账号登录</h1>
        <p class="login-lead">
          公开检索无需登录。账号由管理员邀请发放，使用用户名与密码登录。
        </p>

        <form id="login-form" class="login-form" novalidate>
          <div class="field">
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required placeholder="请输入用户名" />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码" />
          </div>
          <label class="field-check">
            <input type="checkbox" id="want-change-password" />
            登录后立即修改密码
          </label>
          <p class="login-status" id="login-status" role="status" aria-live="polite"></p>
          <button class="btn login-primary" type="submit" id="login-btn">登录</button>
        </form>

        <div id="panel-change-password" class="login-panel" hidden>
          <h2 class="login-subtitle">修改密码</h2>
          <p class="field-hint" id="change-password-hint">首次登录或勾选修改时，请设置新密码。</p>
          <form id="change-password-form" class="login-form" novalidate>
            <div class="field" id="old-password-field">
              <label for="old-password">当前密码</label>
              <input id="old-password" name="old_password" type="password" autocomplete="current-password" />
            </div>
            <div class="field">
              <label for="new-password">新密码</label>
              <input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="6" />
            </div>
            <div class="field">
              <label for="new-password2">确认新密码</label>
              <input id="new-password2" name="new_password2" type="password" autocomplete="new-password" required minlength="6" />
            </div>
            <p class="login-status" id="change-status" role="status" aria-live="polite"></p>
            <button class="btn login-primary" type="submit">保存并进入</button>
          </form>
        </div>

        <p class="login-footer">
          <a href="/">先不登录，继续检索 →</a>
        </p>
      </section>
    </div>
  </main>

  <script src="/static/js/common.js?v=26"></script>
  <script src="/static/js/login.js?v=6"></script>
</body>
</html>
