<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 税局人事检�?/title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=28" />
</head>
<body class="app app-login" data-page="login">
  <header class="app-header" id="app-header"></header>

  <main class="app-main login-main">
    <div class="login-shell">
      <section class="login-card" aria-labelledby="login-heading">
        <p class="login-eyebrow">账号</p>
        <h1 class="login-title" id="login-heading">登录</h1>
        <p class="login-lead">
          公开检索无需登录。登录后可关注单�?人员，并在有新任免时收到通知�?
        </p>

        <div class="login-method-tabs" role="tablist" aria-label="登录方式">
          <button type="button" class="login-method is-active" role="tab" aria-selected="true" data-channel="email" id="tab-email">
            邮箱验证�?
          </button>
          <button type="button" class="login-method" role="tab" aria-selected="false" data-channel="phone" id="tab-phone">
            手机验证�?
          </button>
        </div>

        <!-- Account step -->
        <div id="panel-account" class="login-panel">
          <form id="account-form" class="login-form" novalidate>
            <div class="field" id="email-field">
              <label for="email">邮箱地址</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username email"
                placeholder="name@example.com"
                aria-describedby="account-hint"
              />
            </div>
            <div class="field" id="phone-field" hidden>
              <label for="phone">手机�?/label>
              <input
                id="phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                autocomplete="tel"
                maxlength="13"
                placeholder="11 位手机号"
                aria-describedby="account-hint"
              />
            </div>
            <p class="field-hint" id="account-hint">验证码约 15 分钟内有效�?/p>
            <p class="login-status" id="account-status" role="status" aria-live="polite"></p>
            <button class="btn login-primary" type="submit" id="send-btn">获取验证�?/button>
          </form>
        </div>

        <!-- Code step -->
        <div id="panel-code" class="login-panel" hidden>
          <form id="code-form" class="login-form" novalidate>
            <p class="login-sent">
              验证码已发送至 <strong id="sent-account"></strong>
              <button type="button" class="link-btn" id="change-account-btn">更换</button>
            </p>
            <div class="field">
              <label for="code">6 位验证码</label>
              <input
                id="code"
                name="code"
                type="text"
                inputmode="numeric"
                pattern="\d{6}"
                maxlength="6"
                minlength="6"
                required
                autocomplete="one-time-code"
                placeholder="······"
                aria-describedby="code-hint"
                spellcheck="false"
              />
              <p class="field-hint" id="code-hint">输入�?6 位后自动登录；约 15 分钟内有效�?/p>
            </div>
            <p class="login-status" id="code-status" role="status" aria-live="polite"></p>
            <button class="btn login-primary" type="submit" id="verify-btn">登录</button>
            <button class="btn secondary login-resend" type="button" id="resend-btn" disabled>重新获取</button>
          </form>
        </div>

        <p class="login-footer">
          <a href="/">先不登录，继续检�?�?/a>
        </p>
      </section>
    </div>
  </main>

  <script src="/static/js/common.js?v=17"></script>
  <script src="/static/js/login.js?v=4"></script>
</body>
</html>
