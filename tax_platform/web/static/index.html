<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人员查询 · 税局人事检索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=55" />
</head>
<body class="app" data-page="search">
  <header class="app-header" id="app-header"></header>

  <main class="app-main">
    <div class="shell">
      <section class="stats-strip" id="stats-strip" aria-label="数据概览"></section>

      <section class="panel-card" aria-labelledby="filter-heading">
        <h2 class="panel-heading" id="filter-heading">检索筛选</h2>
        <form class="filter-grid" id="search-form" autocomplete="off">
          <div class="field">
            <label for="org_level">地区层级</label>
            <select id="org_level" name="org_level">
              <option value="">全部层级</option>
            </select>
          </div>
          <div class="field">
            <label for="region_category">地区分类</label>
            <select id="region_category" name="region_category">
              <option value="">全部分类</option>
            </select>
          </div>
          <div class="field">
            <label for="bureau_code">具体地区</label>
            <select id="bureau_code" name="bureau_code">
              <option value="">全部地区</option>
            </select>
          </div>
          <div class="field">
            <label for="department">工作科室</label>
            <select id="department" name="department">
              <option value="">全部科室</option>
            </select>
          </div>
          <div class="field">
            <label for="title">职务</label>
            <select id="title" name="title">
              <option value="">全部职务</option>
            </select>
          </div>
          <div class="field field-span-2">
            <label for="name">人员姓名</label>
            <input id="name" name="name" type="search" placeholder="输入姓名，留空表示不限" autocomplete="off" />
          </div>
          <div class="field">
            <label for="date_from">任职日起</label>
            <input id="date_from" name="date_from" type="date" />
          </div>
          <div class="field">
            <label for="date_to">任职日止</label>
            <input id="date_to" name="date_to" type="date" />
          </div>
          <div class="filter-actions">
            <button class="btn" type="submit" id="search-btn">查询</button>
            <button class="btn secondary" type="button" id="reset-btn">重置</button>
            <button class="btn secondary" type="button" id="export-btn">导出 CSV</button>
            <button class="btn secondary" type="button" id="export-xlsx-btn">导出 Excel</button>
          </div>
        </form>
        <div class="watch-bar" id="search-watch-bar" hidden aria-label="关注当前地区"></div>
      </section>

      <section class="results-section" aria-live="polite">
        <div class="results-summary" id="result-meta">点击「查询」浏览人员，默认每页 50 条</div>
        <div class="person-list" id="results" role="list">
          <div class="results-empty" id="results-empty">全部留空 = 列出库内所有人员（分页）；也可先选地区/科室/职务/姓名缩小范围</div>
        </div>
        <nav class="pagination" id="pagination" aria-label="结果分页" hidden></nav>
        <div class="status" id="status" hidden></div>
      </section>
    </div>
  </main>

  <script src="/static/js/common.js?v=26"></script>
  <script src="/static/js/search.js?v=34"></script>
</body>
</html>
