<p>文号：沪税浦委任〔2026〕32号</p>
<p>发文单位：国家税务总局上海市浦东新区税务局</p>
<p>发文日期：2026-06-04</p>
<div>
经研究，决定：
赵健健任保税区税务分局法制科副科长；任职试用期为一年。
顾承为任保税区税务分局征收管理科副科长；任职试用期为一年。

免去缪军职务。
